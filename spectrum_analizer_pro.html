<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-SPECTRUM V4.5 - Master Suite</title>
    <style>
        :root {
            /* FabFilter Dark / Cyan (Default) */
            --bg-base: #121215;
            --panel-bg: #1a1a20;
            --panel-header: #22222b;
            --border-color: #31313d;
            --accent: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.15);
            --accent-glow: rgba(0, 229, 255, 0.35);
            --text-main: #f4f4f8;
            --text-muted: #8c8c9e;
            --danger: #ff3366;
            --warning: #ffaa00;
            --success: #00cc66;
        }

        /* SSL Console Green */
        body.theme-ssl {
            --bg-base: #0a100d;
            --panel-bg: #131f18;
            --panel-header: #1b2d23;
            --border-color: #274233;
            --accent: #00ff66;
            --accent-dim: rgba(0, 255, 102, 0.15);
            --accent-glow: rgba(0, 255, 102, 0.35);
            --danger: #ff2a5f;
            --warning: #ffcc00;
        }

        /* Neve Vintage Amber */
        body.theme-neve {
            --bg-base: #14110e;
            --panel-bg: #221c17;
            --panel-header: #30261f;
            --border-color: #483b30;
            --accent: #ff9900;
            --accent-dim: rgba(255, 153, 0, 0.15);
            --accent-glow: rgba(255, 153, 0, 0.35);
            --danger: #ff3344;
            --warning: #ffdd00;
        }

        /* Slate Cyber Purple */
        body.theme-slate {
            --bg-base: #0e0b14;
            --panel-bg: #181322;
            --panel-header: #231b30;
            --border-color: #382b4d;
            --accent: #b026ff;
            --accent-dim: rgba(176, 38, 255, 0.15);
            --accent-glow: rgba(176, 38, 255, 0.35);
            --danger: #ff2266;
            --warning: #00ffff;
        }

        /* Solid State Orange */
        body.theme-orange {
            --bg-base: #140d0a;
            --panel-bg: #221612;
            --panel-header: #301f19;
            --border-color: #4c3127;
            --accent: #ff5500;
            --accent-dim: rgba(255, 85, 0, 0.15);
            --accent-glow: rgba(255, 85, 0, 0.35);
            --danger: #ff0055;
            --warning: #ffbb00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            transition: background 0.3s ease;
        }

        .plugin-container {
            width: 100%;
            max-width: 1400px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Fullscreen state styling */
        .plugin-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
        }
        .plugin-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel-header);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .brand span {
            font-size: 0.7rem;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent);
            font-weight: 600;
        }

        .master-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* RACK DI CONTROLLO / PARAMETRI */
        .control-rack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--panel-header);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent);
            font-weight: bold;
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus, input[type="range"]:focus {
            border-color: var(--accent);
        }

        /* DISPLAY DELL'ANALIZZATORE */
        .display-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 480px;
            background: #060608;
            display: flex;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* FOOTER & METERS */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: var(--panel-header);
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
        }

        .meters-panel {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .meter-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meter-container {
            width: 120px;
            height: 8px;
            background: var(--bg-base);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success), var(--warning) 80%, var(--danger));
            transition: width 0.05s ease;
        }

        button.btn-primary {
            background: var(--accent);
            color: var(--bg-base);
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button.btn-primary:hover {
            box-shadow: 0 0 15px var(--accent-glow);
            filter: brightness(1.1);
        }

        button.btn-primary.active {
            background: var(--danger);
            color: white;
        }

        button.btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        button.btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .checkbox-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="plugin-container" id="pluginContainer">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <h1>PRO-SPECTRUM ANALYZER</h1>
                <span>ULTRA V4.5</span>
            </div>
            <div class="master-controls">
                <button id="fullscreenBtn" class="btn-secondary">Fullscreen</button>
                <button id="toggleBtn" class="btn-primary">Avvia Microfono</button>
            </div>
        </header>

        <!-- RACK PARAMETRI PROFESSIONALI -->
        <div class="control-rack">
            <div class="control-group">
                <label>Visual Mode</label>
                <select id="modeSelect">
                    <option value="filled">Filled Gradient</option>
                    <option value="neon">Neon Wireframe</option>
                    <option value="octave">ISO 1/3 Octave Bands</option>
                    <option value="waterfall">Waterfall 3D Spectrogram</option>
                    <option value="oscilloscope">Oscilloscope (Time-Domain)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Color Theme</label>
                <select id="themeSelect">
                    <option value="theme-fabfilter">FabFilter Cyan (Default)</option>
                    <option value="theme-ssl">SSL Console Green</option>
                    <option value="theme-neve">Neve Vintage Amber</option>
                    <option value="theme-slate">Slate Cyber Purple</option>
                    <option value="theme-orange">Solid State Orange</option>
                </select>
            </div>

            <div class="control-group">
                <label>FFT Resolution <span id="fftVal">4096</span></label>
                <select id="fftSelect">
                    <option value="2048">2048 (Fast)</option>
                    <option value="4096" selected>4096 (Balanced)</option>
                    <option value="8192">8192 (High Res)</option>
                    <option value="16384">16384 (Ultra Detail)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tilt Compens. <span id="tiltVal">4.5 dB/oct</span></label>
                <input type="range" id="tiltRange" min="0" max="9" step="0.5" value="4.5">
            </div>

            <div class="control-group">
                <label>Smoothing <span id="smoothVal">0.85</span></label>
                <input type="range" id="smoothRange" min="0.1" max="0.95" step="0.05" value="0.85">
            </div>

            <div class="control-group" style="justify-content: center;">
                <div class="checkbox-row">
                    <label class="checkbox-label"><input type="checkbox" id="peakHoldCheck" checked> Peak Hold</label>
                    <label class="checkbox-label"><input type="checkbox" id="gridCheck" checked> Grid</label>
                </div>
            </div>
        </div>

        <!-- CANVAS DISPLAY -->
        <div class="display-container">
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <!-- FOOTER & METERS -->
        <footer>
            <div class="meters-panel">
                <div class="meter-bar-wrapper">
                    <span>RMS / Peak:</span>
                    <div class="meter-container">
                        <div id="meterFill" class="meter-fill"></div>
                    </div>
                </div>
                <div class="status-item">Stato: <strong id="statusText" style="color: var(--text-muted);">Inattivo</strong></div>
            </div>
            <div class="status-item">Sample Rate: <strong id="sampleRateVal">-- kHz</strong></div>
        </footer>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const pluginContainer = document.getElementById('pluginContainer');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('spectrumCanvas');
        const ctx = canvas.getContext('2d');

        const modeSelect = document.getElementById('modeSelect');
        const themeSelect = document.getElementById('themeSelect');
        const fftSelect = document.getElementById('fftSelect');
        const fftVal = document.getElementById('fftVal');
        const tiltRange = document.getElementById('tiltRange');
        const tiltVal = document.getElementById('tiltVal');
        const smoothRange = document.getElementById('smoothRange');
        const smoothVal = document.getElementById('smoothVal');
        const peakHoldCheck = document.getElementById('peakHoldCheck');
        const gridCheck = document.getElementById('gridCheck');
        const meterFill = document.getElementById('meterFill');
        const sampleRateVal = document.getElementById('sampleRateVal');

        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let isRunning = false;
        let animationId = null;
        let peakValues = [];
        let waterfallHistory = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Fullscreen Toggle with Dynamic Text
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                pluginContainer.requestFullscreen().catch(err => {
                    console.error("Errore attivazione fullscreen:", err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = 'Exit Fullscreen';
            } else {
                fullscreenBtn.textContent = 'Fullscreen';
            }
            setTimeout(resizeCanvas, 100);
        });

        // Theme Switcher
        themeSelect.addEventListener('change', () => {
            document.body.className = '';
            if (themeSelect.value !== 'theme-fabfilter') {
                document.body.classList.add(themeSelect.value);
            }
        });

        // UI Event Listeners
        fftSelect.addEventListener('change', () => {
            fftVal.textContent = fftSelect.value;
            if (analyser) analyser.fftSize = parseInt(fftSelect.value);
            peakValues = [];
        });

        tiltRange.addEventListener('input', () => {
            tiltVal.textContent = tiltRange.value + ' dB/oct';
        });

        smoothRange.addEventListener('input', () => {
            smoothVal.textContent = smoothRange.value;
            if (analyser) analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
        });

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                
                analyser.fftSize = parseInt(fftSelect.value);
                analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
                
                microphone.connect(analyser);
                
                isRunning = true;
                toggleBtn.textContent = 'Ferma Analisi';
                toggleBtn.classList.add('active');
                statusText.textContent = 'Attivo (Live Mic)';
                statusText.style.color = 'var(--success)';
                sampleRateVal.textContent = (audioCtx.sampleRate / 1000).toFixed(1) + ' kHz';
                
                drawSpectrum();
            } catch (err) {
                alert('Impossibile accedere al microfono. Verifica i permessi del browser.');
                console.error(err);
                statusText.textContent = 'Errore permessi';
            }
        }

        function stopAudio() {
            if (microphone && microphone.mediaStream) {
                microphone.mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioCtx) audioCtx.close();
            cancelAnimationFrame(animationId);
            isRunning = false;
            toggleBtn.textContent = 'Avvia Microfono';
            toggleBtn.classList.remove('active');
            statusText.textContent = 'Inattivo';
            statusText.style.color = 'var(--text-muted)';
            meterFill.style.width = '0%';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isRunning) initAudio();
            else stopAudio();
        });

        function drawGrid() {
            if (!gridCheck.checked) return;
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = '10px sans-serif';

            // dB Lines
            const dbSteps = [-6, -18, -30, -42, -54, -66];
            dbSteps.forEach(db => {
                const y = height * (1 - (db + 72) / 72);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
                ctx.fillText(`${db} dB`, 12, y - 4);
            });

            // Logarithmic Frequency Markers
            const freqMarkers = [
                { f: 50, label: '50Hz' },
                { f: 100, label: '100Hz' },
                { f: 250, label: '250Hz' },
                { f: 500, label: '500Hz' },
                { f: 1000, label: '1kHz' },
                { f: 2500, label: '2.5kHz' },
                { f: 5000, label: '5kHz' },
                { f: 10000, label: '10kHz' },
                { f: 20000, label: '20kHz' }
            ];

            const minLog = Math.log10(20);
            const maxLog = Math.log10(20000);

            freqMarkers.forEach(marker => {
                const logFreq = Math.log10(marker.f);
                const x = width * (logFreq - minLog) / (maxLog - minLog);
                
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
                ctx.fillText(marker.label, x + 4, height - 10);
            });
        }

        function drawSpectrum() {
            if (!isRunning) return;

            animationId = requestAnimationFrame(drawSpectrum);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            ctx.clearRect(0, 0, width, height);
            drawGrid();

            const nyquist = audioCtx.sampleRate / 2;
            const minLog = Math.log10(20);
            const maxLog = Math.log10(20000);
            const tiltFactor = parseFloat(tiltRange.value);
            const mode = modeSelect.value;
            const computedAccent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#00e5ff';

            if (peakValues.length !== Math.round(width)) {
                peakValues = new Array(Math.round(width)).fill(0);
            }

            // RMS Level Meter calculation
            let sumSquares = 0;
            for(let i=0; i<bufferLength; i++) {
                let norm = dataArray[i] / 255;
                sumSquares += norm * norm;
            }
            let rms = Math.sqrt(sumSquares / bufferLength);
            meterFill.style.width = Math.min(100, rms * 250) + '%';

            // --- VISUALIZATION MODES ---
            if (mode === 'oscilloscope') {
                // Time-domain Oscilloscope mode
                const timeData = new Uint8Array(analyser.fftSize);
                analyser.getByteTimeDomainData(timeData);

                ctx.save();
                ctx.strokeStyle = computedAccent;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = computedAccent;
                ctx.beginPath();

                const sliceWidth = width / timeData.length;
                let x = 0;
                for (let i = 0; i < timeData.length; i++) {
                    let v = timeData[i] / 128.0; // 1.0 is center
                    let y = v * (height / 2);

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    x += sliceWidth;
                }
                ctx.stroke();
                ctx.restore();
                return;
            }

            if (mode === 'waterfall') {
                // Waterfall 3D Spectrogram History Mode
                let sliceData = [];
                for (let x = 0; x < width; x += 4) {
                    const logFreq = minLog + (x / width) * (maxLog - minLog);
                    const freq = Math.pow(10, logFreq);
                    if (freq <= nyquist) {
                        const index = Math.round((freq / nyquist) * bufferLength);
                        sliceData.push(dataArray[index] || 0);
                    } else {
                        sliceData.push(0);
                    }
                }
                waterfallHistory.unshift(sliceData);
                if (waterfallHistory.length > 90) waterfallHistory.pop();

                ctx.save();
                for (let i = 0; i < waterfallHistory.length; i++) {
                    let alpha = 1 - (i / waterfallHistory.length);
                    ctx.strokeStyle = computedAccent;
                    ctx.globalAlpha = alpha * 0.85;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    let row = waterfallHistory[i];
                    let stepX = width / row.length;
                    for (let j = 0; j < row.length; j++) {
                        let x = j * stepX;
                        let y = (height * 0.85) - (i * 5.5) - ((row[j] / 255) * 100);
                        if (j === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                ctx.restore();
                return;
            }

            if (mode === 'octave') {
                // ISO 1/3 Octave Bands mode
                const barCount = 28;
                const barWidth = width / barCount;
                for (let i = 0; i < barCount; i++) {
                    let index = Math.floor(Math.pow(i / barCount, 1.8) * (bufferLength / 2));
                    let value = dataArray[Math.min(index, bufferLength - 1)] || 0;
                    let normY = (value / 255) * height;
                    
                    let grad = ctx.createLinearGradient(0, height, 0, 0);
                    grad.addColorStop(0, computedAccent);
                    grad.addColorStop(1, 'rgba(255,255,255,0.9)');
                    ctx.fillStyle = grad;

                    ctx.fillRect(i * barWidth + 3, height - normY, barWidth - 6, normY);

                    // Peak line per bar
                    ctx.fillStyle = '#ffaa00';
                    ctx.fillRect(i * barWidth + 3, height - normY - 3, barWidth - 6, 2);
                }
                return;
            }

            // Standard continuous curves (Filled Gradient, Neon Wireframe)
            ctx.lineWidth = mode === 'neon' ? 2 : 1.5;
            ctx.strokeStyle = computedAccent;
            
            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, computedAccent);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;

            if (mode === 'neon') {
                ctx.shadowBlur = 18;
                ctx.shadowColor = computedAccent;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.moveTo(0, height);

            let points = [];

            for (let x = 0; x < width; x++) {
                const logFreq = minLog + (x / width) * (maxLog - minLog);
                const freq = Math.pow(10, logFreq);
                
                if (freq > nyquist) continue;

                const index = Math.round((freq / nyquist) * bufferLength);
                let value = dataArray[index] || 0;

                let octaveMultiplier = Math.log2(freq / 1000); 
                let tiltAdjustment = octaveMultiplier * tiltFactor * 1.5;
                let adjustedValue = Math.min(255, Math.max(0, value + tiltAdjustment));

                const normalizedY = adjustedValue / 255;
                const y = height * (1 - normalizedY);

                points.push({ x, y });

                if (peakValues[x] === undefined || y < peakValues[x]) {
                    peakValues[x] = y;
                } else {
                    peakValues[x] += 1.8;
                    if (peakValues[x] > height) peakValues[x] = height;
                }
            }

            if (points.length > 0) {
                ctx.moveTo(points[0].x, points[0].y);
                for (let p of points) {
                    ctx.lineTo(p.x, p.y);
                }
            }

            if (mode === 'filled') {
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.stroke();

            // Peak Hold rendering
            if (peakHoldCheck.checked && mode !== 'waterfall') {
                ctx.strokeStyle = 'rgba(255, 170, 0, 0.85)';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                for (let x = 0; x < width; x++) {
                    if (x === 0) ctx.moveTo(x, peakValues[x]);
                    else ctx.lineTo(x, peakValues[x]);
                }
                ctx.stroke();
            }
        }

        drawGrid();
    </script>
</body>
</html>
