<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-SPECTRUM V3.5 - Advanced Audio Suite</title>
    <style>
        :root {
            --bg-base: #0c0c0e;
            --panel-bg: #16161a;
            --panel-header: #1f1f26;
            --border-color: #2e2e38;
            --accent: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.15);
            --accent-glow: rgba(0, 229, 255, 0.3);
            --text-main: #f0f0f5;
            --text-muted: #9999a6;
            --danger: #ff3366;
            --warning: #ffaa00;
            --success: #00cc66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .plugin-container {
            width: 100%;
            max-width: 1300px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel-header);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .brand span {
            font-size: 0.7rem;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid var(--accent);
            font-weight: 600;
        }

        .master-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* RACK DI CONTROLLO / PARAMETRI */
        .control-rack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--panel-header);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent);
            font-weight: bold;
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        select:focus, input[type="range"]:focus {
            border-color: var(--accent);
        }

        /* DISPLAY DELL'ANALIZZATORE */
        .display-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #08080a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* FOOTER / METERS */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: var(--panel-header);
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
        }

        .meters-panel {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .meter-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meter-container {
            width: 120px;
            height: 8px;
            background: var(--bg-base);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success), var(--warning) 80%, var(--danger));
            transition: width 0.05s ease;
        }

        button.btn-primary {
            background: var(--accent);
            color: var(--bg-base);
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button.btn-primary:hover {
            box-shadow: 0 0 15px var(--accent-glow);
            filter: brightness(1.1);
        }

        button.btn-primary.active {
            background: var(--danger);
            color: white;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="plugin-container">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <h1>PRO-SPECTRUM ANALYZER</h1>
                <span>PRO SUITE</span>
            </div>
            <div class="master-controls">
                <button id="toggleBtn" class="btn-primary">Avvia Microfono</button>
            </div>
        </header>

        <!-- RACK PARAMETRI PROFESIONALI -->
        <div class="control-rack">
            <div class="control-group">
                <label>FFT Resolution <span id="fftVal">4096</span></label>
                <select id="fftSelect">
                    <option value="2048">2048 (Fast)</option>
                    <option value="4096" selected>4096 (Balanced)</option>
                    <option value="8192">8192 (High Res)</option>
                    <option value="16384">16384 (Ultra Detail)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tilt Compens. <span id="tiltVal">4.5 dB/oct</span></label>
                <input type="range" id="tiltRange" min="0" max="9" step="0.5" value="4.5">
            </div>

            <div class="control-group">
                <label>Smoothing <span id="smoothVal">0.85</span></label>
                <input type="range" id="smoothRange" min="0.1" max="0.95" step="0.05" value="0.85">
            </div>

            <div class="control-group">
                <label>Visual Mode</label>
                <select id="modeSelect">
                    <option value="filled">Filled Gradient</option>
                    <option value="line">Line Wireframe</option>
                    <option value="bars">Bars / FFT bins</option>
                </select>
            </div>

            <div class="control-group" style="justify-content: center; gap: 10px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="peakHoldCheck" checked> Mostra Peak Hold
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="gridCheck" checked> Griglia Logaritmica
                </label>
            </div>
        </div>

        <!-- CANVAS DISPLAY -->
        <div class="display-container">
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <!-- FOOTER & METERS -->
        <footer>
            <div class="meters-panel">
                <div class="meter-bar-wrapper">
                    <span>Peak L/R:</span>
                    <div class="meter-container">
                        <div id="meterFill" class="meter-fill"></div>
                    </div>
                </div>
                <div class="status-item">Stato: <strong id="statusText" style="color: var(--text-muted);">Inattivo</strong></div>
            </div>
            <div class="status-item">Sample Rate: <strong id="sampleRateVal">-- kHz</strong></div>
        </footer>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('spectrumCanvas');
        const ctx = canvas.getContext('2d');

        const fftSelect = document.getElementById('fftSelect');
        const fftVal = document.getElementById('fftVal');
        const tiltRange = document.getElementById('tiltRange');
        const tiltVal = document.getElementById('tiltVal');
        const smoothRange = document.getElementById('smoothRange');
        const smoothVal = document.getElementById('smoothVal');
        const modeSelect = document.getElementById('modeSelect');
        const peakHoldCheck = document.getElementById('peakHoldCheck');
        const gridCheck = document.getElementById('gridCheck');
        const meterFill = document.getElementById('meterFill');
        const sampleRateVal = document.getElementById('sampleRateVal');

        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let isRunning = false;
        let animationId = null;
        let peakValues = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // UI Event Listeners
        fftSelect.addEventListener('change', () => {
            fftVal.textContent = fftSelect.value;
            if (analyser) analyser.fftSize = parseInt(fftSelect.value);
            peakValues = [];
        });

        tiltRange.addEventListener('input', () => {
            tiltVal.textContent = tiltRange.value + ' dB/oct';
        });

        smoothRange.addEventListener('input', () => {
            smoothVal.textContent = smoothRange.value;
            if (analyser) analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
        });

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                
                analyser.fftSize = parseInt(fftSelect.value);
                analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
                
                microphone.connect(analyser);
                
                isRunning = true;
                toggleBtn.textContent = 'Ferma Analisi';
                toggleBtn.classList.add('active');
                statusText.textContent = 'Attivo (Live)';
                statusText.style.color = 'var(--success)';
                sampleRateVal.textContent = (audioCtx.sampleRate / 1000).toFixed(1) + ' kHz';
                
                drawSpectrum();
            } catch (err) {
                alert('Impossibile accedere al microfono. Controlla i permessi del browser.');
                console.error(err);
                statusText.textContent = 'Errore';
            }
        }

        function stopAudio() {
            if (microphone && microphone.mediaStream) {
                microphone.mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioCtx) audioCtx.close();
            cancelAnimationFrame(animationId);
            isRunning = false;
            toggleBtn.textContent = 'Avvia Microfono';
            toggleBtn.classList.remove('active');
            statusText.textContent = 'Inattivo';
            statusText.style.color = 'var(--text-muted)';
            meterFill.style.width = '0%';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isRunning) initAudio();
            else stopAudio();
        });

        function drawGrid() {
            if (!gridCheck.checked) return;
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#777785';
            ctx.font = '10px sans-serif';

            // dB Lines (-6, -18, -30, -42, -54, -66 dB)
            const dbSteps = [-6, -18, -30, -42, -54, -66];
            dbSteps.forEach(db => {
                const y = height * (1 - (db + 72) / 72);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
                ctx.fillText(`${db} dB`, 12, y - 4);
            });

            // Logarithmic Frequency Markers
            const freqMarkers = [
                { f: 50, label: '50Hz' },
                { f: 100, label: '100Hz' },
                { f: 250, label: '250Hz' },
                { f: 500, label: '500Hz' },
                { f: 1000, label: '1kHz' },
                { f: 2500, label: '2.5kHz' },
                { f: 5000, label: '5kHz' },
                { f: 10000, label: '10kHz' },
                { f: 20000, label: '20kHz' }
            ];

            const minLog = Math.log10(20);
            const maxLog = Math.log10(20000);

            freqMarkers.forEach(marker => {
                const logFreq = Math.log10(marker.f);
                const x = width * (logFreq - minLog) / (maxLog - minLog);
                
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
                ctx.fillText(marker.label, x + 4, height - 10);
            });
        }

        function drawSpectrum() {
            if (!isRunning) return;

            animationId = requestAnimationFrame(drawSpectrum);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            ctx.clearRect(0, 0, width, height);
            drawGrid();

            const nyquist = audioCtx.sampleRate / 2;
            const minLog = Math.log10(20);
            const maxLog = Math.log10(20000);
            const tiltFactor = parseFloat(tiltRange.value);
            const mode = modeSelect.value;

            if (peakValues.length !== Math.round(width)) {
                peakValues = new Array(Math.round(width)).fill(0);
            }

            // Calcola RMS generale per il meter nel footer
            let sumSquares = 0;
            for(let i=0; i<bufferLength; i++) {
                let norm = dataArray[i] / 255;
                sumSquares += norm * norm;
            }
            let rms = Math.sqrt(sumSquares / bufferLength);
            meterFill.style.width = Math.min(100, rms * 250) + '%';

            // Configurazione stile di disegno
            ctx.lineWidth = mode === 'line' ? 2 : 1.5;
            ctx.strokeStyle = '#00e5ff';
            
            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, 'rgba(0, 229, 255, 0.35)');
            gradient.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
            ctx.fillStyle = gradient;

            ctx.beginPath();
            ctx.moveTo(0, height);

            let points = [];

            for (let x = 0; x < width; x++) {
                const logFreq = minLog + (x / width) * (maxLog - minLog);
                const freq = Math.pow(10, logFreq);
                
                if (freq > nyquist) continue;

                const index = Math.round((freq / nyquist) * bufferLength);
                let value = dataArray[index] || 0;

                // Applicazione della curva di Tilt compensata in base alla frequenza
                let octaveMultiplier = Math.log2(freq / 1000); 
                let tiltAdjustment = octaveMultiplier * tiltFactor * 1.5;
                let adjustedValue = Math.min(255, Math.max(0, value + tiltAdjustment));

                const normalizedY = adjustedValue / 255;
                const y = height * (1 - normalizedY);

                points.push({ x, y });

                // Gestione Peak Hold decay
                if (peakValues[x] === undefined || y < peakValues[x]) {
                    peakValues[x] = y; // Più alto visivamente = valore Y minore
                } else {
                    peakValues[x] += 1.5; // Decadimento graduale del picco
                    if (peakValues[x] > height) peakValues[x] = height;
                }

                if (mode === 'bars' && x % 4 === 0) {
                    ctx.fillRect(x, y, 3, height - y);
                }
            }

            if (mode !== 'bars') {
                if (points.length > 0) {
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let p of points) {
                        ctx.lineTo(p.x, p.y);
                    }
                }
                if (mode === 'filled') {
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.stroke();
            }

            // Disegno della linea Peak Hold superiore
            if (peakHoldCheck.checked) {
                ctx.strokeStyle = 'rgba(255, 170, 0, 0.7)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let x = 0; x < width; x++) {
                    if (x === 0) ctx.moveTo(x, peakValues[x]);
                    else ctx.lineTo(x, peakValues[x]);
                }
                ctx.stroke();
            }
        }

        drawGrid();
    </script>
</body>
</html>
