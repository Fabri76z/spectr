<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-SPECTRUM ANALYZER - Professional Audio Suite</title>
    <style>
        :root {
            --bg-base: #0f1013;
            --panel-bg: #16171c;
            --panel-header: #1e1f26;
            --border-color: #2a2b36;
            --accent: #00bcd4;
            --accent-dim: rgba(0, 188, 212, 0.15);
            --accent-glow: rgba(0, 188, 212, 0.3);
            --text-main: #e2e2e8;
            --text-muted: #8b8c9d;
            --danger: #e53935;
            --warning: #ffb300;
            --success: #43a047;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .plugin-container {
            width: 100%;
            max-width: 1350px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* FULLSCREEN MODIFIER */
        .plugin-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--panel-header);
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: var(--text-main);
        }

        .brand span {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
            font-weight: 400;
        }

        .master-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* RACK DI CONTROLLO PARAMETRI */
        .control-rack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: var(--panel-header);
            padding: 8px 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent);
            font-weight: 600;
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        select:focus, input[type="range"]:focus {
            border-color: var(--accent);
        }

        /* DISPLAY DELL'ANALIZZATORE */
        .display-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 480px;
            background: #0a0b0d;
        }

        .plugin-container:fullscreen .display-container {
            height: auto;
            flex-grow: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* FOOTER & PRO RMS METERS */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--panel-header);
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
        }

        .meters-panel {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .rms-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rms-label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .rms-meter-container {
            width: 220px;
            height: 14px;
            background: var(--bg-base);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            display: flex;
        }

        .rms-meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success) 0%, var(--success) 65%, var(--warning) 85%, var(--danger) 100%);
            transition: width 0.04s linear;
        }

        .rms-value-text {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--accent);
            min-width: 45px;
        }

        /* BOTTONI PROFESSIONALI */
        button.btn-action {
            background: var(--accent);
            color: var(--bg-base);
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.8px;
            transition: all 0.2s;
        }

        button.btn-action:hover {
            box-shadow: 0 0 10px var(--accent-glow);
            filter: brightness(1.1);
        }

        button.btn-action.active {
            background: var(--danger);
            color: #ffffff;
        }

        button.btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.8px;
            transition: all 0.2s;
        }

        button.btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="plugin-container" id="pluginContainer">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <h1>PRO-SPECTRUM ANALYZER</h1>
                <span>v5</span>
            </div>
            <div class="master-controls">
                <button id="fullscreenBtn" class="btn-secondary">Fullscreen</button>
                <button id="toggleBtn" class="btn-action">Start Mic</button>
            </div>
        </header>

        <!-- RACK PARAMETRI -->
        <div class="control-rack">
            <div class="control-group">
                <label>FFT Resolution <span id="fftVal">4096</span></label>
                <select id="fftSelect">
                    <option value="2048">2048 (Fast)</option>
                    <option value="4096" selected>4096 (Balanced)</option>
                    <option value="8192">8192 (High Res)</option>
                    <option value="16384">16384 (Ultra)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Color Theme <span id="themeVal">FabFilter</span></label>
                <select id="themeSelect">
                    <option value="fabfilter">FabFilter Cyan</option>
                    <option value="ssl">SSL Console Green</option>
                    <option value="neve">Neve Vintage Amber</option>
                    <option value="prism">Prism Sound Blue</option>
                    <option value="protools">Pro-Tools Graphite</option>
                    <option value="slate">Slate Engineering</option>
                    <option value="orange">Solaris High-Contrast</option>
                    <option value="cyber">Cyberpunk Accent</option>
                </select>
            </div>

            <div class="control-group">
                <label>Visual Mode <span id="modeVal">Filled</span></label>
                <select id="modeSelect">
                    <option value="filled">Filled Gradient Spectrum</option>
                    <option value="line">Line Wireframe</option>
                    <option value="bars">Standard FFT Bars</option>
                    <option value="iso13">ISO 1/3 Octave Bands</option>
                    <option value="narrowOct">High-Res Narrow Octave</option>
                    <option value="vintage">Vintage Stereo LED VU</option>
                    <option value="oscilloscope">Oscilloscope (Time Domain)</option>
                    <option value="dual">Dual Trace (Spectrum + Wave)</option>
                    <option value="waterfall">Waterfall 3D Spectrogram</option>
                    <option value="circular">Radial Circular Spectrum</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tilt Compens. <span id="tiltVal">4.5 dB/oct</span></label>
                <input type="range" id="tiltRange" min="0" max="9" step="0.5" value="4.5">
            </div>

            <div class="control-group">
                <label>Smoothing <span id="smoothVal">0.85</span></label>
                <input type="range" id="smoothRange" min="0.1" max="0.95" step="0.05" value="0.85">
            </div>

            <div class="control-group" style="justify-content: center; gap: 6px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="peakHoldCheck" checked> Peak Hold / Decay
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="gridCheck" checked> Log Grid & Markers
                </label>
            </div>
        </div>

        <!-- CANVAS DISPLAY -->
        <div class="display-container">
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <!-- FOOTER & PRO RMS METERS -->
        <footer>
            <div class="meters-panel">
                <div class="rms-wrapper">
                    <span class="rms-label">INPUT RMS:</span>
                    <div class="rms-meter-container">
                        <div id="rmsFill" class="rms-meter-fill"></div>
                    </div>
                    <span id="rmsValueText" class="rms-value-text">-inf dB</span>
                </div>
                <div class="status-item">Status: <strong id="statusText" style="color: var(--text-muted);">Idle</strong></div>
            </div>
            <div class="status-item">Sample Rate: <strong id="sampleRateVal">-- kHz</strong></div>
        </footer>
    </div>

    <script>
        const themes = {
            fabfilter: { accent: '#00e5ff', dim: 'rgba(0, 229, 255, 0.15)', glow: 'rgba(0, 229, 255, 0.3)', bg: '#0f1013', panel: '#16171c', header: '#1e1f26', border: '#2a2b36' },
            ssl: { accent: '#00e676', dim: 'rgba(0, 230, 118, 0.15)', glow: 'rgba(0, 230, 118, 0.3)', bg: '#0d1210', panel: '#131a16', header: '#1b241f', border: '#25332b' },
            neve: { accent: '#ffab00', dim: 'rgba(255, 171, 0, 0.15)', glow: 'rgba(255, 171, 0, 0.3)', bg: '#14120e', panel: '#1c1914', header: '#26221b', border: '#332e25' },
            prism: { accent: '#40c4ff', dim: 'rgba(64, 196, 255, 0.15)', glow: 'rgba(64, 196, 255, 0.3)', bg: '#0f1117', panel: '#151922', header: '#1e2330', border: '#293142' },
            protools: { accent: '#b388ff', dim: 'rgba(179, 136, 255, 0.15)', glow: 'rgba(179, 136, 255, 0.3)', bg: '#111014', panel: '#191720', header: '#221f2c', border: '#2e2b3c' },
            slate: { accent: '#90a4ae', dim: 'rgba(144, 164, 174, 0.15)', glow: 'rgba(144, 164, 174, 0.3)', bg: '#101112', panel: '#17191a', header: '#202324', border: '#2c3033' },
            orange: { accent: '#ff6d00', dim: 'rgba(255, 109, 0, 0.15)', glow: 'rgba(255, 109, 0, 0.3)', bg: '#140f0c', panel: '#1c1613', header: '#261f1b', border: '#332a25' },
            cyber: { accent: '#ff0055', dim: 'rgba(255, 0, 85, 0.15)', glow: 'rgba(255, 0, 85, 0.3)', bg: '#140d10', panel: '#1c1317', header: '#261a20', border: '#33242c' }
        };

        function setTheme(themeName) {
            const t = themes[themeName] || themes.fabfilter;
            const r = document.documentElement;
            r.style.setProperty('--accent', t.accent);
            r.style.setProperty('--accent-dim', t.dim);
            r.style.setProperty('--accent-glow', t.glow);
            r.style.setProperty('--bg-base', t.bg);
            r.style.setProperty('--panel-bg', t.panel);
            r.style.setProperty('--panel-header', t.header);
            r.style.setProperty('--border-color', t.border);
            document.getElementById('themeVal').textContent = themeSelect.options[themeSelect.selectedIndex].text.split(' ')[0];
        }

        const toggleBtn = document.getElementById('toggleBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const pluginContainer = document.getElementById('pluginContainer');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('spectrumCanvas');
        const ctx = canvas.getContext('2d');

        const fftSelect = document.getElementById('fftSelect');
        const fftVal = document.getElementById('fftVal');
        const themeSelect = document.getElementById('themeSelect');
        const modeSelect = document.getElementById('modeSelect');
        const modeVal = document.getElementById('modeVal');
        const tiltRange = document.getElementById('tiltRange');
        const tiltVal = document.getElementById('tiltVal');
        const smoothRange = document.getElementById('smoothRange');
        const smoothVal = document.getElementById('smoothVal');
        const peakHoldCheck = document.getElementById('peakHoldCheck');
        const gridCheck = document.getElementById('gridCheck');
        const rmsFill = document.getElementById('rmsFill');
        const rmsValueText = document.getElementById('rmsValueText');
        const sampleRateVal = document.getElementById('sampleRateVal');

        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let isRunning = false;
        let animationId = null;
        let peakValues = [];
        let octavePeakValues = [];
        let narrowPeakValues = [];
        let vintagePeakValues = [];
        let waterfallBuffer = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                pluginContainer.requestFullscreen().catch(err => {
                    alert(`Errore attivazione Fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = 'Exit Fullscreen';
            } else {
                fullscreenBtn.textContent = 'Fullscreen';
            }
            setTimeout(resizeCanvas, 50);
        });

        fftSelect.addEventListener('change', () => {
            fftVal.textContent = fftSelect.value;
            if (analyser) analyser.fftSize = parseInt(fftSelect.value);
            resetPeaks();
        });

        themeSelect.addEventListener('change', () => setTheme(themeSelect.value));
        modeSelect.addEventListener('change', () => {
            modeVal.textContent = modeSelect.options[modeSelect.selectedIndex].text.split(' ')[0];
            resetPeaks();
        });

        tiltRange.addEventListener('input', () => { tiltVal.textContent = tiltRange.value + ' dB/oct'; });
        smoothRange.addEventListener('input', () => {
            smoothVal.textContent = smoothRange.value;
            if (analyser) analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
        });

        function resetPeaks() {
            peakValues = [];
            octavePeakValues = [];
            narrowPeakValues = [];
            vintagePeakValues = [];
            waterfallBuffer = [];
        }

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                
                analyser.fftSize = parseInt(fftSelect.value);
                analyser.smoothingTimeConstant = parseFloat(smoothRange.value);
                
                microphone.connect(analyser);
                
                isRunning = true;
                toggleBtn.textContent = 'Stop';
                toggleBtn.classList.add('active');
                statusText.textContent = 'Live Input Active';
                statusText.style.color = 'var(--success)';
                sampleRateVal.textContent = (audioCtx.sampleRate / 1000).toFixed(1) + ' kHz';
                
                drawSpectrum();
            } catch (err) {
                alert('Impossibile accedere al microfono. Verifica i permessi del browser.');
                console.error(err);
                statusText.textContent = 'Mic Error';
            }
        }

        function stopAudio() {
            if (microphone && microphone.mediaStream) {
                microphone.mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioCtx) audioCtx.close();
            cancelAnimationFrame(animationId);
            isRunning = false;
            toggleBtn.textContent = 'Start Mic';
            toggleBtn.classList.remove('active');
            statusText.textContent = 'Idle';
            statusText.style.color = 'var(--text-muted)';
            rmsFill.style.width = '0%';
            rmsValueText.textContent = '-inf dB';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        toggleBtn.addEventListener('click', () => {
            if (!isRunning) initAudio();
            else stopAudio();
        });

        function drawGrid() {
            if (!gridCheck.checked) return;
            const width = canvas.width / window.devicePixelRatio;
